<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<title>Sabir Tray Panel</title>
<link rel="stylesheet" href="base.css">
<style>
#root { width: 380px; height: 580px; box-sizing: border-box; background: #EDE4D3; border: 1px solid #D8CBB2; border-radius: 12px; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
.wm { font-family: 'Cinzel', serif; font-weight: 600; font-size: 16px; letter-spacing: 4px; color: #1E1C1A; }
.icon-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: rgba(30, 28, 26, .06); }
.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 18px 18px; }
.hero .t { font-size: 17px; font-weight: 600; color: #1E1C1A; }
.hero .s { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6B5F4E; max-width: 330px; }
.hero .s span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn { margin: 0 18px; padding: 14px 16px; background: #F6F0E4; border: 1px solid #D8CBB2; border-radius: 10px; }
.arow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #D8CBB2; }
.arow:last-child { padding: 9px 0 2px; border-bottom: none; }
.arow .n { flex: 1; font-size: 14px; font-weight: 500; color: #1E1C1A; }
.arow .st { font-size: 12px; }
.act { padding: 16px 18px 0; flex: 1; min-height: 0; overflow: hidden; }
.item { display: flex; gap: 12px; padding: 7px 0; }
.item .tm { font-family: 'Barlow Condensed', sans-serif; font-weight: 500; color: #6B5F4E; font-size: 12px; letter-spacing: 1px; width: 38px; padding-top: 1px; flex-shrink: 0; }
.item .b { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item .a { font-size: 13px; color: #1E1C1A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { font-size: 12px; color: #6B5F4E; }
.empty { font-size: 13px; color: #6B5F4E; padding: 7px 0; line-height: 1.5; }
.foot { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-top: 1px solid #D8CBB2; }
.pause { height: 40px; padding: 0 16px; border: 1.5px solid #1E1C1A; background: transparent; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1E1C1A; }
.pause:hover { background: rgba(30, 28, 26, .05); }
</style>
</head>
<body>
<div id="root">
  <div class="top">
    <div class="wm">SABIR</div>
    <button class="icon-btn" aria-label="Settings" id="settings"></button>
  </div>
  <div class="hero" id="hero"></div>
  <div class="conn"><div class="label">CONNECTED</div><div id="agents"></div></div>
  <div class="act"><div class="label" style="margin-bottom: 4px">ACTIVITY</div><div id="items"></div></div>
  <div class="foot">
    <button class="pause" id="pause"></button>
    <a href="#" id="open" style="font-size: 13px; font-weight: 500">Open Sabir →</a>
  </div>
</div>
<script src="logo.js"></script>
<script src="tray-view.js"></script>
</body></html>
