<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<title>Sabir Permission Request</title>
<link rel="stylesheet" href="base.css">
<style>
#root { width: 420px; height: 250px; box-sizing: border-box; background: #EDE4D3; border: 1px solid #D8CBB2; border-top: 4px solid #3F7A6D; border-radius: 12px; font-family: 'Inter', sans-serif; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.t { font-size: 17px; font-weight: 600; color: #1E1C1A; line-height: 1.3; }
.t span { border-bottom: 2px solid #B08D57; }
.d { font-size: 13px; color: #6B5F4E; line-height: 1.5; }
.btns { display: flex; gap: 8px; margin-top: auto; }
.b1 { flex: 1; height: 42px; border: none; background: #1E1C1A; color: #EDE4D3; border-radius: 8px; font-size: 13px; font-weight: 600; }
.b1:hover { background: #2E2B28; }
.b2 { flex: 1; height: 42px; border: 1.5px solid #1E1C1A; background: transparent; color: #1E1C1A; border-radius: 8px; font-size: 13px; font-weight: 600; }
.b2:hover { background: rgba(30, 28, 26, .05); }
.b3 { height: 42px; padding: 0 14px; border: none; background: transparent; color: #6B5F4E; border-radius: 8px; font-size: 13px; font-weight: 500; }
.b3:hover { color: #1E1C1A; }
#root { -webkit-app-region: drag; }
button { -webkit-app-region: no-drag; }
</style>
</head>
<body>
<div id="root">
  <div style="display: flex; gap: 14px; align-items: flex-start">
    <span id="logo"></span>
    <div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
      <div class="label">PERMISSION</div>
      <div class="t" id="title">Claude wants to use <span>Photoshop</span></div>
      <div class="d" id="desc">First time. Sabir will look at the interface and learn what it can do.</div>
    </div>
  </div>
  <div class="btns">
    <button class="b1" data-d="always">Always allow</button>
    <button class="b2" data-d="once">Allow once</button>
    <button class="b3" data-d="deny">Deny</button>
  </div>
</div>
<script src="logo.js"></script>
<script src="permission-view.js"></script>
</body></html>
